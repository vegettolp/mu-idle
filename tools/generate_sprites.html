<!DOCTYPE html>
<html>
<head>
<title>MU Idle - Sprite Generator</title>
<style>
body { background: #111; color: white; font-family: Arial; padding: 20px; }
canvas { border: 1px solid #333; margin: 10px; }
button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #6b21a8; color: white; border: none; border-radius: 4px; font-size: 14px; }
button:hover { background: #8b31c8; }
.preview { display: flex; flex-wrap: wrap; gap: 20px; }
</style>
</head>
<body>
<h1>🎨 MU Idle - Sprite Generator</h1>
<p>Gere sprites 4 frames (idle, walk1, walk2, attack) para cada personagem.</p>

<div>
  <button onclick="generateSprite('dark_knight', '#dc2626')">Dark Knight</button>
  <button onclick="generateSprite('dark_wizard', '#3b82f6')">Dark Wizard</button>
  <button onclick="generateSprite('elf', '#10b981')">Elf</button>
  <button onclick="generateMonster('spider', '#444')">Spider</button>
  <button onclick="generateMonster('skeleton', '#ddd')">Skeleton</button>
  <button onclick="generateMonster('larva', '#5a7a3a')">Larva</button>
</div>

<div class="preview" id="preview"></div>

<script>
function generateSprite(name, color) {
  const canvas = document.createElement('canvas')
  canvas.width = 256
  canvas.height = 64
  const ctx = canvas.getContext('2d')
  
  // Frame 0: Idle
  drawCharacter(ctx, 32, 32, color, 'idle')
  
  // Frame 1: Walk1
  drawCharacter(ctx, 96, 32, color, 'walk1')
  
  // Frame 2: Walk2
  drawCharacter(ctx, 160, 32, color, 'walk2')
  
  // Frame 3: Attack
  drawCharacter(ctx, 224, 32, color, 'attack')
  
  // Download
  const link = document.createElement('a')
  link.download = `${name}.png`
  link.href = canvas.toDataURL()
  link.click()
  
  // Preview
  const preview = document.getElementById('preview')
  const img = new Image()
  img.src = canvas.toDataURL()
  img.style.width = '256px'
  img.style.height = '64px'
  img.style.imageRendering = 'pixelated'
  preview.innerHTML = `<h3>${name}.png</h3>`
  preview.appendChild(img)
}

function drawCharacter(ctx, cx, cy, color, pose) {
  const s = 28
  
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)'
  ctx.beginPath()
  ctx.ellipse(cx, cy + s/2 - 2, s*0.4, s*0.1, 0, 0, Math.PI*2)
  ctx.fill()
  
  if (pose === 'attack') {
    // Cabeça
    ctx.fillStyle = color
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.5, s*0.3, 0, Math.PI*2); ctx.fill()
    // Corpo
    ctx.fillRect(cx - s*0.3 + 3, cy - s*0.2, s*0.5, s*0.6)
    // Braço atacando
    ctx.fillStyle = color
    ctx.save()
    ctx.translate(cx + s*0.3, cy - s*0.1)
    ctx.rotate(-0.6)
    ctx.fillRect(-2, -s*0.4, 4, s*0.5)
    ctx.restore()
    // Olhos
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(cx, cy - s*0.55, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.fillStyle = '#000'
    ctx.beginPath(); ctx.arc(cx + 1, cy - s*0.55, 1.2, 0, Math.PI*2); ctx.fill()
  } else if (pose === 'walk1') {
    ctx.fillStyle = color
    ctx.beginPath(); ctx.arc(cx, cy - s*0.55, s*0.3, 0, Math.PI*2); ctx.fill()
    ctx.fillRect(cx - s*0.25, cy - s*0.3, s*0.5, s*0.6)
    // Perna esquerda frente
    ctx.fillStyle = '#333'
    ctx.fillRect(cx - s*0.2, cy + s*0.2, 5, s*0.25)
    ctx.fillRect(cx + s*0.05, cy + s*0.15, 5, s*0.3)
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.fillStyle = '#000'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
  } else if (pose === 'walk2') {
    ctx.fillStyle = color
    ctx.beginPath(); ctx.arc(cx, cy - s*0.55, s*0.3, 0, Math.PI*2); ctx.fill()
    ctx.fillRect(cx - s*0.25, cy - s*0.3, s*0.5, s*0.6)
    ctx.fillStyle = '#333'
    ctx.fillRect(cx - s*0.2, cy + s*0.15, 5, s*0.3)
    ctx.fillRect(cx + s*0.05, cy + s*0.2, 5, s*0.25)
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.fillStyle = '#000'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
  } else {
    ctx.fillStyle = color
    ctx.beginPath(); ctx.arc(cx, cy - s*0.55, s*0.3, 0, Math.PI*2); ctx.fill()
    ctx.fillRect(cx - s*0.25, cy - s*0.3, s*0.5, s*0.6)
    ctx.fillStyle = '#333'
    ctx.fillRect(cx - s*0.15, cy + s*0.15, 4, s*0.3)
    ctx.fillRect(cx + s*0.05, cy + s*0.15, 4, s*0.3)
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 2.5, 0, Math.PI*2); ctx.fill()
    ctx.fillStyle = '#000'
    ctx.beginPath(); ctx.arc(cx - 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 3, cy - s*0.6, 1.2, 0, Math.PI*2); ctx.fill()
  }
}

function generateMonster(name, color) {
  const canvas = document.createElement('canvas')
  canvas.width = 256
  canvas.height = 64
  const ctx = canvas.getContext('2d')
  
  for (let i = 0; i < 4; i++) {
    const cx = 32 + i * 64
    const cy = 32
    ctx.fillStyle = color
    ctx.fillRect(cx - 14, cy - 14, 28, 28)
    ctx.fillStyle = '#f00'
    ctx.beginPath(); ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI*2); ctx.fill()
    ctx.beginPath(); ctx.arc(cx + 4, cy - 4, 3, 0, Math.PI*2); ctx.fill()
    ctx.fillStyle = '#fff'
    ctx.font = '8px Arial'
    ctx.textAlign = 'center'
    ctx.fillText(name, cx, cy + 22)
  }
  
  const link = document.createElement('a')
  link.download = `${name}.png`
  link.href = canvas.toDataURL()
  link.click()
}

// Gerar todos automaticamente
setTimeout(() => {
  generateSprite('dark_knight', '#dc2626')
  generateSprite('dark_wizard', '#3b82f6')
  generateSprite('elf', '#10b981')
  generateMonster('spider', '#555')
  generateMonster('skeleton', '#ddd')
  generateMonster('larva', '#5a7a3a')
}, 500)
</script>
</body>
</html>
